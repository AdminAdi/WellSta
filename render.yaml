services:
  - type: web
    name: mindfeed-backend
    env: node
    plan: free
    buildCommand: cd Server && npm install
    startCommand: cd Server && node index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_KEY
        value: mindfeed-secret-key-2025
    autoDeploy: true

  - type: web
    name: mindfeed-frontend
    env: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://mindfeed-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html 